<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cooking Buddy 🍳</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:       #f5f0e8;
    --cream-mid:   #ede5d4;
    --cream-dark:  #d9cdb8;
    --sidebar-bg:  #e8dfc9;
    --brown-light: #c4a882;
    --brown-mid:   #9b7a56;
    --brown-dark:  #6b4e35;
    --brown-deep:  #4a3220;
    --sage:        #7d9b76;
    --sage-light:  #a8c4a0;
    --sage-bg:     #dce8d8;
    --orange:      #c8632a;
    --orange-light:#e8a060;
    --orange-bg:   #f5deca;
    --text-dark:   #3a2510;
    --text-mid:    #6b4e35;
    --shadow:      0 4px 24px rgba(90,60,30,0.14);
    --chat-max:    680px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* subtle texture overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%239b7a56' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none; z-index: 0;
  }

  /* SIDEBAR */
  .sidebar {
    width: 185px; height: 100vh;
    background: var(--sidebar-bg);
    border-right: 2px solid var(--cream-dark);
    padding: 20px 14px;
    display: flex; flex-direction: column; gap: 6px;
    flex-shrink: 0; overflow-y: auto; position: relative; z-index: 1;
  }
  .sidebar-logo {
    font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 800;
    color: var(--brown-dark);
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 7px;
    letter-spacing: -0.3px;
  }
  .sidebar-logo .si { font-size: 22px; }
  .sidebar h3 {
    font-family: 'Nunito', sans-serif; color: var(--brown-mid);
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    font-weight: 900; margin-bottom: 4px; margin-top: 4px;
  }
  .history-item {
    background: rgba(255,255,255,0.5); border: 1.5px solid var(--cream-dark);
    border-radius: 9px; padding: 7px 10px;
    font-size: 12px; font-weight: 700; color: var(--text-dark);
    cursor: pointer; transition: all 0.2s; word-break: break-word;
  }
  .history-item:hover { background: white; transform: translateX(3px); border-color: var(--brown-mid); }

  /* CHAT SHELL */
  .chat-shell { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; z-index: 1; }

  /* TOP BAR */
  .topbar {
    padding: 14px 24px; background: var(--brown-deep);
    border-bottom: 2px solid var(--brown-dark);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    box-shadow: 0 2px 16px rgba(30,15,5,0.2);
  }
  .topbar-icon { font-size: 22px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .topbar-name {
    font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 800;
    color: var(--orange-light);
    letter-spacing: -0.3px;
  }
  .topbar-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--sage); margin: 0 4px; }
  .topbar-sub { font-size: 11px; color: var(--brown-light); font-weight: 700; margin-left: auto; letter-spacing: 1px; text-transform: uppercase; }

  /* CHAT FEED */
  .chat-feed {
    flex: 1; overflow-y: auto;
    padding: 24px 22px 14px;
    display: flex; flex-direction: column; gap: 18px;
    scroll-behavior: smooth;
  }

  /* AVATAR */
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, var(--brown-dark), var(--orange));
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0; margin-top: 2px;
    box-shadow: 0 2px 8px rgba(90,40,10,0.25);
  }

  /* WELCOME */
  .welcome-row { display: flex; gap: 10px; align-items: flex-start; max-width: var(--chat-max); }
  .welcome-bubble {
    background: white; border-radius: 4px 16px 16px 16px;
    padding: 14px 18px; box-shadow: var(--shadow);
    border: 1.5px solid var(--cream-dark);
    font-size: 14px; font-weight: 600; color: var(--text-dark); line-height: 1.75;
  }
  .welcome-bubble strong { color: var(--orange); }

  /* USER IMAGE BUBBLE */
  .user-row { display: flex; justify-content: flex-end; max-width: var(--chat-max); width: 100%; align-self: flex-end; }
  .user-bubble {
    background: linear-gradient(135deg, var(--brown-dark), var(--orange));
    border-radius: 16px 4px 16px 16px; padding: 7px;
    box-shadow: var(--shadow); max-width: 200px;
  }
  .user-bubble img { width: 100%; border-radius: 10px; display: block; max-height: 160px; object-fit: cover; }
  .user-note { color: rgba(255,255,255,0.85); font-size: 11px; font-weight: 700; padding: 5px 6px 2px; text-align: right; }

  /* BOT ROW */
  .bot-row {
    display: flex; gap: 10px; align-items: flex-start;
    max-width: var(--chat-max); width: 100%; align-self: flex-start;
    animation: fadeUp 0.35s ease both;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  .bot-row > div:last-child { max-width: calc(var(--chat-max) - 56px); width: 100%; }

  /* CHIP CARD */
  .chips-card {
    background: white; border-radius: 4px 16px 16px 16px;
    padding: 14px 16px; box-shadow: var(--shadow); border: 1.5px solid var(--cream-dark);
  }
  .chips-label { font-family: 'Playfair Display', serif; font-size: 13px; color: var(--brown-mid); margin-bottom: 10px; font-weight: 700; }
  .chips-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--cream-mid); border: 1.5px solid var(--cream-dark);
    border-radius: 50px; padding: 5px 13px;
    font-size: 13px; font-weight: 800; color: var(--text-dark);
    display: flex; align-items: center; gap: 5px;
    animation: popIn 0.3s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes popIn { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
  .chip.cal { background: var(--orange-bg); border-color: var(--orange-light); color: var(--brown-deep); }
  .chip.conf { background: var(--sage-bg); border-color: var(--sage-light); color: var(--brown-deep); }

  /* RECIPE CARD */
  .recipe-card {
    background: white; border-radius: 4px 16px 16px 16px;
    padding: 14px 16px; box-shadow: var(--shadow); border: 1.5px solid var(--cream-dark);
  }
  .recipe-card-title { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--orange); margin-bottom: 10px; font-weight: 700; }
  .recipe-item {
    background: var(--cream); border-radius: 11px; padding: 11px 13px;
    margin-bottom: 8px; border: 1.5px solid var(--cream-dark);
  }
  .recipe-item:last-child { margin-bottom: 0; }
  .recipe-item-name { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--text-dark); margin-bottom: 3px; font-weight: 700; }
  .recipe-item-meta { font-size: 12px; color: var(--text-mid); font-weight: 600; line-height: 1.6; }
  .recipe-tags { font-size: 11px; color: var(--brown-light); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* SUMMARY CARD */
  .summary-card {
    background: white; border-radius: 4px 16px 16px 16px;
    padding: 14px 16px; box-shadow: var(--shadow); border: 1.5px solid var(--cream-dark);
    font-size: 14px; line-height: 1.8; color: var(--text-mid); font-weight: 600;
  }
  .summary-card h3 { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--text-dark); margin: 10px 0 4px; font-weight: 700; }
  .summary-card h3:first-child { margin-top: 0; }
  .summary-card ul { padding-left: 16px; margin: 3px 0 6px; }
  .summary-card li { margin-bottom: 3px; }
  .summary-card strong { color: var(--text-dark); }
  .summary-card p { margin: 2px 0; }

  /* TYPING */
  .typing-bubble {
    background: white; border-radius: 4px 16px 16px 16px;
    padding: 14px 18px; box-shadow: var(--shadow); border: 1.5px solid var(--cream-dark);
    display: flex; align-items: center; gap: 5px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brown-light); animation: bounce 1.2s infinite; }
  .dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
  @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-7px)} }
  .typing-label { font-size: 12px; font-weight: 700; color: var(--brown-mid); margin-left: 4px; }

  /* INPUT BAR */
  .input-bar {
    flex-shrink: 0; background: var(--brown-deep);
    border-top: 2px solid var(--brown-dark);
    padding: 12px 20px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 -4px 16px rgba(30,15,5,0.15);
  }
  .mini-drop {
    position: relative; width: 46px; height: 46px; border-radius: 12px;
    border: 2px dashed var(--brown-light); background: rgba(255,255,255,0.08);
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0; overflow: hidden;
  }
  .mini-drop:hover { border-color: var(--orange-light); background: rgba(255,255,255,0.15); transform: scale(1.06); }
  .mini-drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .mini-drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 9px; display: none; }
  .mini-drop img.show { display: block; }
  .mini-icon { pointer-events: none; }
  .note-input {
    flex: 1; background: rgba(255,255,255,0.1); border: 1.5px solid var(--brown-mid);
    border-radius: 50px; padding: 11px 18px;
    font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700;
    color: var(--cream); outline: none; transition: border-color 0.2s;
  }
  .note-input:focus { border-color: var(--orange-light); background: rgba(255,255,255,0.15); }
  .note-input::placeholder { color: var(--brown-light); }
  .send-btn {
    background: linear-gradient(135deg, var(--orange), var(--orange-light));
    border: none; border-radius: 50%; width: 46px; height: 46px;
    color: white; font-size: 18px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(150,60,10,0.4);
    transition: all 0.2s; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 18px rgba(150,60,10,0.5); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* scrollbar */
  .chat-feed::-webkit-scrollbar { width: 5px; }
  .chat-feed::-webkit-scrollbar-track { background: transparent; }
  .chat-feed::-webkit-scrollbar-thumb { background: var(--cream-dark); border-radius: 10px; }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--cream-dark); border-radius: 10px; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo"><span class="si">🍳</span>cooking.buddy</div>
  <h3>🕐 History</h3>
  <div id="historyList">
    <div style="font-size:11px;color:var(--brown-light);font-weight:700;padding:4px 2px;line-height:1.6;">Upload something to see history here 🍽</div>
  </div>
</aside>

<!-- CHAT -->
<div class="chat-shell">
  <div class="topbar">
    <span class="topbar-icon">🍳</span>
    <span class="topbar-name">cooking.buddy</span>
    <div class="topbar-dot"></div>
    <span class="topbar-sub">AI Food Analyser</span>
  </div>

  <div class="chat-feed" id="chatFeed">
    <div class="welcome-row">
      <div class="avatar">🍳</div>
      <div class="welcome-bubble">
        Hey there! 👋 I'm <strong>Cooking Buddy</strong>!<br>
        Upload a photo of any ingredient — I'll identify it, share its nutrition info, and suggest recipes you can make with it. 🥕🍅🧄
      </div>
    </div>
  </div>

  <div class="input-bar">
    <div class="mini-drop" id="miniDrop" title="Upload food photo">
      <input type="file" id="fileInput" accept="image/*">
      <span class="mini-icon" id="miniIcon">📷</span>
      <img id="miniPreview" alt="preview">
    </div>
    <input class="note-input" id="noteInput" type="text"
      placeholder="Add a note (e.g. vegetarian, spicy…)"
      onkeydown="if(event.key==='Enter')triggerAnalyze()">
    <button class="send-btn" id="sendBtn" onclick="triggerAnalyze()" disabled>✨</button>
  </div>
</div>

<script>
  const API_URL = "http://localhost:5000/analyze";
  let uploadedFile = null;
  let searchHistory = [];

  const fileInput   = document.getElementById('fileInput');
  const miniDrop    = document.getElementById('miniDrop');
  const miniPreview = document.getElementById('miniPreview');
  const miniIcon    = document.getElementById('miniIcon');
  const sendBtn     = document.getElementById('sendBtn');
  const chatFeed    = document.getElementById('chatFeed');

  fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
  miniDrop.addEventListener('dragover', e => { e.preventDefault(); miniDrop.style.borderColor='var(--orange-light)'; });
  miniDrop.addEventListener('dragleave', () => miniDrop.style.borderColor='');
  miniDrop.addEventListener('drop', e => {
    e.preventDefault(); miniDrop.style.borderColor='';
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  function handleFile(file) {
    uploadedFile = file;
    miniPreview.src = URL.createObjectURL(file);
    miniPreview.classList.add('show');
    miniIcon.style.display = 'none';
    sendBtn.disabled = false;
  }

  function toBase64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  async function triggerAnalyze() {
    if (!uploadedFile) { alert('Please upload a food photo first! 🥑'); return; }
    sendBtn.disabled = true;
    sendBtn.textContent = '⏳';

    appendUserBubble(uploadedFile);
    const typingId = appendTyping();

    try {
      const b64 = await toBase64(uploadedFile);
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: b64 })
      });
      let result;
      try { result = await response.json(); }
      catch { throw new Error('Server returned invalid JSON — check the API console.'); }
      if (!response.ok || result.error) throw new Error(result.error || 'Server error ' + response.status);
      removeTyping(typingId);
      addToHistory(result.food);
      appendBotResults(result);
    } catch (err) {
      removeTyping(typingId);
      appendErrorBubble(err.message);
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = '✨';
      uploadedFile = null;
      miniPreview.classList.remove('show');
      miniIcon.style.display = '';
      fileInput.value = '';
    }
  }

  function scrollBottom() { setTimeout(() => chatFeed.scrollTop = chatFeed.scrollHeight, 60); }

  function appendUserBubble(file) {
    const note = document.getElementById('noteInput').value.trim();
    const url = URL.createObjectURL(file);
    const div = document.createElement('div');
    div.className = 'user-row';
    div.innerHTML = `<div class="user-bubble">
      ${note ? `<div class="user-note">${escapeHtml(note)}</div>` : ''}
      <img src="${url}" alt="uploaded food">
    </div>`;
    chatFeed.appendChild(div);
    scrollBottom();
  }

  let typingCounter = 0;
  function appendTyping() {
    const id = 'typ' + (++typingCounter);
    const div = document.createElement('div');
    div.className = 'bot-row'; div.id = id;
    div.innerHTML = `<div class="avatar">🍳</div>
      <div class="typing-bubble">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <span class="typing-label">Analysing your food…</span>
      </div>`;
    chatFeed.appendChild(div);
    scrollBottom();
    return id;
  }

  function removeTyping(id) { const el = document.getElementById(id); if (el) el.remove(); }

  function appendBotCard(innerHtml, delay) {
    const div = document.createElement('div');
    div.className = 'bot-row';
    div.style.animationDelay = (delay || 0) + 'ms';
    div.innerHTML = `<div class="avatar">🍳</div><div>${innerHtml}</div>`;
    chatFeed.appendChild(div);
    scrollBottom();
  }

  function appendBotResults(result) {
    const food       = result.food || 'Unknown';
    const confidence = (result.confidence || 0).toFixed(1);
    const calories   = result.calories ?? 'N/A';
    const serving    = result.serving  || 'N/A';
    const recipes    = result.recipes  || [];
    const summary    = result.summary  || '';

    appendBotCard(`
      <div class="chips-card">
        <div class="chips-label">🔍 I found this ingredient:</div>
        <div class="chips-row">
          <div class="chip">${ingredientEmoji(food)} ${escapeHtml(food)}</div>
          <div class="chip cal">📊 ${escapeHtml(String(calories))} cal / ${escapeHtml(String(serving))}</div>
          <div class="chip conf">🎯 ${confidence}% confident</div>
        </div>
      </div>`, 0);

    let recipesHTML = '';
    if (!recipes.length) {
      recipesHTML = `<p style="color:var(--brown-light);font-size:13px;font-weight:700;">No matching recipes found.</p>`;
    } else {
      recipesHTML = recipes.map((r, i) => {
        let tagStr = '';
        try { tagStr = JSON.parse(r.tags || '[]').slice(0, 5).join(', '); }
        catch { tagStr = String(r.tags || ''); }
        return `<div class="recipe-item">
          <div class="recipe-item-name">${i+1}. ${escapeHtml(r.name || 'Unnamed')} 🍴</div>
          <div class="recipe-item-meta">
            ${r.servings ? `👥 ${escapeHtml(String(r.servings))} servings` : ''}
            ${r.servings && r.serving_size ? ' · ' : ''}
            ${r.serving_size ? `🥣 ${escapeHtml(String(r.serving_size))}` : ''}
          </div>
          ${tagStr ? `<div class="recipe-tags">🏷️ ${escapeHtml(tagStr)}</div>` : ''}
        </div>`;
      }).join('');
    }
    appendBotCard(`
      <div class="recipe-card">
        <div class="recipe-card-title">🍽️ Matching Recipes</div>
        ${recipesHTML}
      </div>`, 100);

    appendBotCard(`<div class="summary-card">${formatMarkdown(summary)}</div>`, 200);
  }

  function appendErrorBubble(msg) {
    appendBotCard(`
      <div class="chips-card" style="border-color:var(--brown-light);">
        <div style="font-family:'Playfair Display',serif;color:var(--orange);font-size:15px;margin-bottom:8px;font-weight:700;">😵 Oops!</div>
        <div style="font-size:13px;color:var(--text-mid);font-weight:700;line-height:1.7;">
          ${escapeHtml(msg)}<br><br>
          Make sure the server is running:<br>
          <code style="background:var(--cream-mid);padding:2px 8px;border-radius:6px;font-size:12px;">python api_server.py</code>
        </div>
      </div>`);
  }

  function formatMarkdown(raw) {
    if (!raw) return '';
    const lines = raw.split('\n');
    let html = '', inUl = false;
    for (const line of lines) {
      if (/^[*\-] /.test(line)) {
        if (!inUl) { html += '<ul>'; inUl = true; }
        html += '<li>' + inline(escapeHtml(line.replace(/^[*\-] /,''))) + '</li>';
      } else {
        if (inUl) { html += '</ul>'; inUl = false; }
        const t = line.trim();
        if (/^#{1,3} /.test(t)) html += '<h3>' + escapeHtml(t.replace(/^#{1,3} /,'')) + '</h3>';
        else if (!t) html += '<br>';
        else html += '<p>' + inline(escapeHtml(t)) + '</p>';
      }
    }
    if (inUl) html += '</ul>';
    return html;
  }
  function inline(t) {
    return t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function ingredientEmoji(name) {
    const map={tomato:'🍅',potato:'🥔',onion:'🧅',garlic:'🧄',carrot:'🥕',egg:'🥚',chicken:'🍗',beef:'🥩',fish:'🐟',rice:'🍚',pasta:'🍝',bread:'🍞',cheese:'🧀',milk:'🥛',butter:'🧈',lemon:'🍋',apple:'🍎',banana:'🍌',broccoli:'🥦',pepper:'🫑',mushroom:'🍄',spinach:'🥬',corn:'🌽',avocado:'🥑',cucumber:'🥒',shrimp:'🍤',pork:'🥩',lamb:'🍖',tofu:'⬜',noodle:'🍜',flour:'🌾',sugar:'🍬',salt:'🧂',oil:'🫙',ginger:'🫚',mint:'🌿'};
    const k = Object.keys(map).find(k=>name.toLowerCase().includes(k));
    return k ? map[k] : '🍽️';
  }

  function addToHistory(food) {
    const label = food.charAt(0).toUpperCase() + food.slice(1);
    if (!searchHistory.includes(label)) searchHistory.unshift(label);
    if (searchHistory.length > 10) searchHistory.pop();
    document.getElementById('historyList').innerHTML = searchHistory.map(h =>
      `<div class="history-item">${ingredientEmoji(h)} ${escapeHtml(h)}</div>`
    ).join('');
  }
